{% extends 'base.html' %}
{% block title %}Login - DevEducado{% endblock %}
{% block content %}
<section class="max-w-lg mx-auto bg-white rounded-xl border border-slate-200 shadow-sm p-6">
    <h1 class="text-2xl font-bold mb-4">Entrar</h1>
    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1" for="email">Email</label>
            <input id="email" name="email" type="email" required class="w-full border border-slate-300 rounded-md px-3 py-2" />
        </div>
        <div>
            <label class="block text-sm font-medium mb-1" for="senha">Senha</label>
            <input id="senha" name="senha" type="password" required class="w-full border border-slate-300 rounded-md px-3 py-2" />
        </div>
        <button class="w-full bg-slate-900 text-white py-2 rounded-md">Entrar</button>
    </form>
</section>
{% endblock %}
